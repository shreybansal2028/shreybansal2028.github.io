<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="vibeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="45%" stop-color="#c026d3" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="boltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#ffffff" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Dark Container with Rounded Corner Squircle -->
  <rect width="512" height="512" rx="128" fill="#09090b" />

  <!-- Vivid Aurora Gradient Badge -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#vibeGrad)" />

  <!-- Glass Top Reflection -->
  <rect x="20" y="20" width="472" height="236" rx="112" fill="url(#innerGlow)" />

  <!-- Icon Aura Ring -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25" />

  <!-- The Sharp Vibe Check Lightning Bolt -->
  <path
    d="M284 48L80 292H252L228 464L432 220H260L284 48Z"
    fill="#ffffff"
    filter="url(#boltGlow)"
    stroke="#ffffff"
    stroke-width="12"
    stroke-linejoin="round"
  />
</svg>
